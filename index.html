<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission: Clear Customs — Morocco Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--tq:#17b3a8;--tqd:#0e8f87;--sea:#2a86c8;--deep:#12466e;--or:#ff9f1c;--ye:#ffd166;--sand:#f3dfb8;--sand2:#e8cc98;--co:#ef5d60;--gr:#6cc070;--grd:#3f9c4a;--cream:#fff8ea;--ink:#22313f;--mut:#5d6b78;--line:#e6d9bd;--sh:0 6px 0 rgba(18,70,110,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;background:linear-gradient(#bfe9f2,#e9f7f3 40%,var(--cream));color:var(--ink);font-size:17px;line-height:1.45;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--deep)}
h1,h2,h3{margin:0 0 .4em;line-height:1.15}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
/* nav */
#nav{position:sticky;top:0;z-index:20;background:rgba(255,248,234,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--sand2)}
#nav .wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
#nav .logo{font-weight:700;color:var(--deep);margin-right:8px;white-space:nowrap}
#nav .logo small{display:block;font-size:11px;color:var(--co);letter-spacing:.08em}
.tab{border:0;background:transparent;padding:7px 11px;border-radius:999px;font-weight:600;font-size:14px;color:var(--deep)}
.tab:hover{background:#fff}
.tab.on{background:var(--tq);color:#fff;box-shadow:0 3px 0 var(--tqd)}
.sp{flex:1}
.snd{display:flex;align-items:center;gap:4px}
.snd button{border:2px solid var(--sand2);background:#fff;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:600}
.snd button.on{background:var(--ye);border-color:var(--or)}
.snd input{width:70px}
/* buttons */
.btn{border:0;border-radius:16px;padding:11px 20px;font-weight:700;font-size:16px;background:var(--or);color:#3b2500;box-shadow:0 5px 0 #c8770a,0 9px 14px rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c8770a}
.btn.tq{background:var(--tq);color:#fff;box-shadow:0 5px 0 var(--tqd),0 9px 14px rgba(0,0,0,.15)}
.btn.co{background:var(--co);color:#fff;box-shadow:0 5px 0 #b93c40,0 9px 14px rgba(0,0,0,.15)}
.btn.wh{background:#fff;color:var(--deep);box-shadow:0 5px 0 #cfd8de,0 9px 14px rgba(0,0,0,.12)}
.btn.gr{background:var(--gr);color:#0f3b16;box-shadow:0 5px 0 var(--grd),0 9px 14px rgba(0,0,0,.15)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
/* views */
.view{display:none;padding:14px 0 50px}
.view.on{display:block}
.card{background:#fff;border-radius:22px;padding:18px 20px;box-shadow:var(--sh);border:2px solid var(--line)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--sand);color:#6a4b10}
.tag.req{background:#d7f3dc;color:#1f6a2b}.tag.cond{background:#ffe9c2;color:#8a5200}.tag.na{background:#eceff2;color:#59636d}.tag.sup{background:#dcefff;color:#12466e}
.note{background:#fff3cf;border-left:6px solid var(--or);border-radius:10px;padding:8px 12px;font-size:14.5px;margin:8px 0}
.edu{font-size:12px;font-weight:700;color:var(--co);letter-spacing:.06em;text-transform:uppercase}
/* scene */
.scene{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 10px 0 rgba(18,70,110,.2),0 20px 40px rgba(18,70,110,.2);border:4px solid #fff;background:#9ad8ea}
.scene svg{display:block;width:100%;height:auto}
.bld{cursor:pointer;transition:transform .18s;transform-box:fill-box;transform-origin:50% 100%}
.bld:hover,.bld:focus{transform:scale(1.08) rotate(-1deg);outline:none}
.bld.cur .halo{opacity:1;animation:pulse 1.2s infinite}
.bld .halo{opacity:0}
.bld.lock{filter:saturate(.45) brightness(1.03);}
.bld.done .chk{opacity:1}
.bld .chk{opacity:0}
.bld.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.15);opacity:.4}}
.halo{transform-box:fill-box;transform-origin:center}
.wave{animation:wv 7s linear infinite}
.wave.b{animation-duration:11s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-120px)}}
.cloud{animation:cl 60s linear infinite}
.cloud.b{animation-duration:90s}
@keyframes cl{from{transform:translateX(-260px)}to{transform:translateX(1300px)}}
.hook{animation:hk 6s ease-in-out infinite}
.hook.b{animation-delay:-3s}
@keyframes hk{0%,100%{transform:translateY(0)}50%{transform:translateY(46px)}}
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(4px) rotate(.6deg)}}
.lorry{animation:lr 22s linear infinite}
@keyframes lr{from{transform:translateX(-140px)}to{transform:translateX(1320px)}}
.ship{transition:transform 3.2s cubic-bezier(.3,.6,.3,1)}
.gatearm{transition:transform 1s;transform-box:fill-box;transform-origin:4% 50%}
.gatearm.open{transform:rotate(-72deg)}
.mtruck{transition:transform 3.5s ease-in}
.hero g.leg{transform-box:fill-box;transform-origin:50% 0}
.hero.walk .leg.l{animation:lg .34s linear infinite}
.hero.walk .leg.r{animation:lg .34s linear infinite reverse}
.hero.walk .bodyg{animation:hb .34s ease-in-out infinite}
@keyframes lg{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}}
@keyframes hb{50%{transform:translateY(-3px)}}
.hero .arm{transform-box:fill-box;transform-origin:50% 8%}
.hero .ppe{display:none}.hero.gear .ppe{display:inline}.hero.gear .noppe{display:none}
.hero.cheer .bodyg{animation:jump .5s ease-out 4}
.hero.cheer .arm.l{transform:rotate(150deg)}.hero.cheer .arm.r{transform:rotate(-150deg)}
@keyframes jump{50%{transform:translateY(-22px)}}
.hero.wavehi .arm.r{animation:wav .5s ease-in-out 4}
@keyframes wav{0%,100%{transform:rotate(-120deg)}50%{transform:rotate(-165deg)}}
.hero.confused .bodyg{animation:tilt .5s ease-in-out 3;transform-box:fill-box;transform-origin:50% 100%}
.hero .qm{opacity:0}.hero.confused .qm{opacity:1}
@keyframes tilt{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:0 0 10px}
.hud .pill{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 12px;font-size:14px;box-shadow:0 3px 0 rgba(18,70,110,.12)}
.hud .pill b{display:block;font-size:11px;letter-spacing:.07em;color:var(--mut);text-transform:uppercase}
.hud .pill.big{font-weight:700;color:var(--deep)}
#folderBtn{background:var(--ye);border:2px solid var(--or);border-radius:16px;padding:6px 14px;font-weight:700;box-shadow:0 4px 0 #c8770a;position:relative}
#folderBtn.bump{animation:pop .5s}
.mapmsg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#fff;border-radius:16px;padding:8px 16px;font-weight:600;box-shadow:0 5px 0 rgba(18,70,110,.2);max-width:92%;text-align:center;border:2px solid var(--ye)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(18,50,80,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:12px}
.ov.open{display:flex}
.modal{background:var(--cream);border-radius:26px;width:min(940px,100%);max-height:94vh;display:flex;flex-direction:column;border:4px solid #fff;box-shadow:0 14px 0 rgba(0,0,0,.18);animation:zoom .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.mh{padding:12px 18px;background:linear-gradient(90deg,var(--tq),var(--sea));color:#fff;border-radius:22px 22px 0 0;display:flex;align-items:center;gap:10px}
.mh h2{margin:0;font-size:20px;flex:1}
.mh small{opacity:.9;font-size:13px;font-weight:500;display:block}
.mh .x{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-weight:700}
.mb{padding:14px 18px;overflow:auto;flex:1}
.mf{padding:10px 18px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:2px dashed var(--line)}
.say{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.say .av{flex:0 0 62px}
.say .bub{background:#fff;border:2px solid var(--line);border-radius:18px;padding:9px 13px;position:relative;font-size:15.5px}
.say .bub:before{content:"";position:absolute;left:-10px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.say .bub b.who{display:block;font-size:11.5px;color:var(--tqd);text-transform:uppercase;letter-spacing:.07em}
.q{font-weight:600;font-size:18px;margin:6px 0 10px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 13px;margin:7px 0;font-size:16px;box-shadow:0 3px 0 rgba(18,70,110,.1)}
.opt:hover{border-color:var(--tq)}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--tq);background:#e4f8f6}.opt.sel .k{background:var(--tq);color:#fff}
.opt.good{border-color:var(--grd);background:#e3f7e5}.opt.bad{border-color:var(--co);background:#fde5e5;animation:shake .35s}
.opt .vw{margin-left:auto;font-size:12.5px;border:2px solid var(--sand2);border-radius:10px;background:var(--cream);padding:3px 8px;font-weight:600;white-space:nowrap}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.srow{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 11px;margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srow span.t{flex:1;min-width:200px}
.srow button{border:2px solid var(--sand2);background:var(--cream);border-radius:10px;padding:4px 9px;font-size:13px;font-weight:600}
.srow button.sel{background:var(--tq);border-color:var(--tqd);color:#fff}
.srow.bad{border-color:var(--co);background:#fde5e5}.srow.good{border-color:var(--grd);background:#e3f7e5}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ord h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.ord .slot{min-height:60px;border:3px dashed var(--sand2);border-radius:14px;padding:6px}
.ord .it{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 10px;margin:4px 0;font-size:15px}
.ord .it b{color:var(--tqd)}
.screen{background:#16324a;border-radius:16px;padding:10px;border:4px solid #0c2134;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.screen .bar{color:#bfe3ff;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.screen .bar i{width:10px;height:10px;border-radius:50%;background:var(--co);display:inline-block}
.screen .bar i+i{background:var(--ye)}.screen .bar i+i+i{background:var(--gr)}
.screen .in{background:#f4f8fb;border-radius:10px;padding:10px;font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:14px;color:#1c2b38}
.screen .in h4{margin:0 0 8px;font-size:15px;color:#12466e;border-bottom:2px solid #cfe0ec;padding-bottom:4px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.frm label{display:block;font-size:12px;font-weight:700;color:#4b5b68;margin-bottom:2px}
.frm select,.frm input,.calc input,.adil input{width:100%;padding:7px 8px;border:2px solid #b9c9d6;border-radius:8px;font:inherit;font-size:14px;background:#fff}
.frm .fld.bad select,.frm .fld.bad input,.calc .bad input{border-color:#d63b3f;background:#ffe9e9;animation:shake .35s}
.frm .fld.good select,.frm .fld.good input,.calc .good input{border-color:#3f9c4a;background:#eaf8ec}
.banner{margin-top:10px;border-radius:10px;padding:9px 12px;font-weight:700;text-align:center;letter-spacing:.04em;font-family:system-ui,Arial,sans-serif}
.banner.no{background:#ffe1e1;color:#a61e22;border:2px solid #d63b3f}.banner.ok{background:#dff5e2;color:#1f6a2b;border:2px solid #3f9c4a}
.calc .row{display:grid;grid-template-columns:1fr 150px 60px;gap:8px;align-items:center;margin:6px 0;background:#fff;border:2px solid var(--line);border-radius:12px;padding:7px 10px}
.calc .row.lockd{opacity:.4;pointer-events:none}
.calc .row small{color:var(--mut);display:block;font-size:12.5px}
.bill{width:100%;border-collapse:collapse;margin-top:8px;font-size:14.5px;background:#fff;border-radius:12px;overflow:hidden}
.bill th,.bill td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right}
.bill th:first-child,.bill td:first-child{text-align:left}
.bill tr.tot td{font-weight:700;background:#fff3cf}
.adil .res{max-height:230px;overflow:auto;margin-top:8px}
.adil .line{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #d5e1ea;background:#fff;padding:8px;font-size:14px}
.adil .line code{font-weight:700;color:#12466e;white-space:nowrap}
.adil .line.sel{background:#d9f3f1}
.fb{border-radius:16px;padding:10px 14px;margin-top:10px;font-size:15.5px}
.fb.ok{background:#e0f6e3;border:2px solid var(--grd)}.fb.no{background:#fde5e5;border:2px solid var(--co)}.fb.info{background:#fff3cf;border:2px solid var(--or)}
.fb h4{margin:0 0 4px}
.desk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--sand);border-radius:14px;padding:7px 10px;margin:6px 0 10px;font-size:13.5px}
.desk b{margin-right:4px}
.chip{border:2px solid var(--sand2);background:#fff;border-radius:10px;padding:4px 9px;font-size:13px;font-weight:600}
.chip:hover{border-color:var(--tq)}
.pts{margin-left:auto;font-weight:700;color:var(--deep)}
/* documents */
.paper{background:#fff;color:#111;font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;line-height:1.3;width:620px;min-height:800px;padding:26px 28px;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.25);overflow:hidden}
.paper:after{content:"EDUCATIONAL SPECIMEN · FICTIONAL";position:absolute;left:-10%;top:46%;width:120%;text-align:center;transform:rotate(-28deg);font-size:34px;font-weight:800;color:rgba(200,40,40,.07);pointer-events:none;letter-spacing:.05em}
.paper h1{font-size:17px;margin:0;letter-spacing:.03em}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}
.paper .hd small{display:block;font-size:9.5px;color:#444}
.paper .spec{font-size:9px;font-weight:700;color:#b3261e;border:1.5px solid #b3261e;padding:2px 6px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.g{display:grid;grid-template-columns:repeat(12,1fr);border-top:1px solid #333;border-left:1px solid #333;margin-bottom:8px}
.g>div{border-right:1px solid #333;border-bottom:1px solid #333;padding:3px 5px;min-height:30px}
.g small{display:block;font-size:8.5px;color:#444;text-transform:none}
.g .h{background:#eef1f4;font-weight:700;min-height:0}
.paper table{width:100%;border-collapse:collapse;margin-bottom:8px}
.paper th,.paper td{border:1px solid #333;padding:3px 5px;text-align:left;font-size:10.5px;vertical-align:top}
.paper th{background:#eef1f4}
.paper .foot{font-size:9px;color:#7a1a14;border-top:1px dashed #b3261e;margin-top:10px;padding-top:5px}
.paper.pink{background:#fbe3ea}.paper.green{background:#f1f8f2}.paper.screen2{background:#f4f8fb}
.f{border-radius:3px;font-weight:700}
.hl .f{outline:2px solid var(--or);outline-offset:1px;background:#fff3cf;cursor:pointer}
.hl .f.act,.f.focus{outline:3px solid var(--co)!important;background:#ffe0e0!important;animation:pulse2 .9s 3}
@keyframes pulse2{50%{outline-offset:5px}}
.dumbox{cursor:pointer}.dumbox:hover{background:#e7f6ff}.dumbox.act{background:#fff3cf;outline:2px solid var(--or);outline-offset:-2px}
#viewer .modal{width:min(1120px,100%);height:94vh}
.vw-body{display:grid;grid-template-columns:1fr 300px;gap:0;flex:1;min-height:0}
.vw-doc{overflow:auto;background:#7c8a96 radial-gradient(#8d9aa5,#6b7985);padding:18px;display:flex;justify-content:center;align-items:flex-start}
.vw-zoom{transform-origin:top center}
.vw-side{background:var(--cream);padding:12px 14px;overflow:auto;border-left:3px solid var(--line);font-size:14.5px}
.vw-side h4{margin:10px 0 2px;font-size:12px;letter-spacing:.07em;color:var(--tqd);text-transform:uppercase}
.vw-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.thumb{width:124px;height:160px;border-radius:8px;overflow:hidden;position:relative;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);border:2px solid #fff;cursor:pointer;flex:0 0 auto;transition:transform .15s}
.thumb:hover{transform:translateY(-4px) rotate(-1.5deg)}
.thumb .paper{transform:scale(.2);transform-origin:0 0;pointer-events:none;box-shadow:none}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(18,70,110,.92);color:#fff;font-size:11.5px;font-weight:600;padding:3px 5px;text-align:center;line-height:1.15}
.thumb.lockd{background:repeating-linear-gradient(45deg,#f1e7cf,#f1e7cf 8px,#eadbb8 8px,#eadbb8 16px);border:2px dashed var(--sand2);box-shadow:none;cursor:default;display:grid;place-items:center;text-align:center;font-size:12px;color:#8b7a52;font-weight:600}
.thumb.new{animation:drop .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{transform:translateY(-60px) rotate(-12deg) scale(.6);opacity:0}}
.thumbs{display:flex;gap:12px;flex-wrap:wrap}
.folderhd{background:linear-gradient(#ffd166,#ffb84a);border-radius:18px 18px 0 0;padding:12px 18px;font-weight:700;font-size:20px;color:#5a3600;display:flex;align-items:center;gap:10px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;margin:8px 0}
.flow span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 8px}
.flow span b{color:var(--tqd)}
.fly{position:fixed;z-index:90;width:44px;height:56px;background:#fff;border:2px solid #333;border-radius:4px;box-shadow:0 4px 8px rgba(0,0,0,.3);transition:all .8s cubic-bezier(.5,-.3,.6,1);pointer-events:none}
/* guide & pages */
.cp h3{margin-top:14px;font-size:15px;color:var(--tqd);text-transform:uppercase;letter-spacing:.06em}
.cp p,.cp ul{margin:.3em 0}
.cp ul{padding-left:20px}
.dcard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:7px 0;font-size:14.5px}
.dcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dcard dl{display:grid;grid-template-columns:130px 1fr;gap:1px 8px;margin:6px 0 0;font-size:13.5px}
.dcard dt{color:var(--mut);font-weight:600}.dcard dd{margin:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{border-radius:14px;padding:9px 12px;font-size:14.5px}
.vs .ma{background:#dff5f3;border:2px solid var(--tq)}.vs .us{background:#e7eefc;border:2px solid #8aa6e0}
.src a{display:inline-block;margin:3px 6px 3px 0;background:#fff;border:2px solid var(--sand2);border-radius:999px;padding:3px 10px;font-size:13px;text-decoration:none;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tl{position:relative;padding-left:26px;border-left:5px solid var(--tq);margin-left:10px}
.tl .ph{position:relative;margin:0 0 14px}
.tl .ph:before{content:attr(data-n);position:absolute;left:-45px;top:8px;width:32px;height:32px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 3px 0 #c8770a}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
/* home */
.hero-wrap{position:relative}
.title{position:absolute;left:0;right:0;top:3%;text-align:center;pointer-events:none}

const DSRC={seller:["invoice","seller","Commercial invoice"],buyer:["company","buyer","Company identification"],rc:["company","rc","Company identification"],broker:["mandate","broker","Broker mandate"],agr:["mandate","agr","Broker mandate"],cartons:["packing","cartons","Packing list"],gross:["packing","gross","Packing list"],net:["packing","net","Packing list"],dispatch:["bl","pol","Bill of lading"],origin:["eur1","origin","EUR.1 / origin evidence"],incoterm:["invoice","incoterm","Commercial invoice"],blno:["bl","blno","Bill of lading"],vessel:["bl","vessel","Bill of lading"],total:["invoice","total","Commercial invoice"],freight:["freightinv","freight","Freight invoice"],insurance:["insurance","insurance","Insurance certificate"],cv:["valuation","cv","Customs value sheet"],hs:["adil","hs","ADIL-style result"],desc:["invoice","desc","Commercial invoice"],qty:["packing","qty","Packing list"],dsno:["ds","dsno","Déclaration sommaire"],title:["engagement","title","Import title (PortNet)"],bank:["domic","bank","Bank domiciliation"],tpi:["valuation","tpi","Customs value sheet"],pod:["bl","pod","Bill of lading"],rate:["valuation","rate","Customs value sheet"],regime:null};
const WHY_EN={seller:"Customs must know who sent the goods.",buyer:"Customs must know who is responsible for the import and who owes the duties.",rc:"Proves the importer is a registered business.",broker:"Shows who lodges and signs the declaration.",agr:"Only an approved declarant may declare for someone else.",cartons:"Lets customs identify and count the cargo.",gross:"Used to identify the cargo and to cross-check the manifest.",net:"Used for statistics and for goods taxed by weight.",dispatch:"Trade statistics and risk analysis.",origin:"Origin decides whether a preferential rate or a trade-defence measure applies.",incoterm:"Shows which costs are already inside the invoice price.",blno:"Links the declaration to the cargo that arrived.",vessel:"Identifies the means of transport.",total:"Starting point of the customs value.",freight:"Must be added to the price under FCA.",insurance:"Must be added to the price under FCA.",cv:"Base for calculating duties and taxes.",hs:"Decides the rates and the controls.",desc:"Must match the tariff code and the invoice.",qty:"Statistics and consistency checks.",dsno:"Links the DUM to the summary declaration that put the cargo under customs supervision.",title:"Customs charges the import title so the bank can later pay the supplier.",bank:"Links the customs operation to the foreign-exchange file.",tpi:"Shows the amount to pay.",pod:"Decides which customs office handles the file.",rate:"Converts the foreign currency into dirhams.",regime:"Decides the legal treatment of the goods."};

let GEN=false;
const mkP=o=>new Proxy(o,{get(o2,k){const v=o2[k];if(v&&typeof v==="object")return mkP(v);return GEN&&(typeof v==="string"||typeof v==="number")?"……":v}});
const C=mkP(CASE);
const gf=(n,dd)=>GEN?"……":fmt(n,dd);
/* ============ DOCUMENT SPECIMENS ============ */
let OV=null; // per-render overrides (used for the spot-the-error challenge)
const d=k=>GEN?`<span class="f gph" data-f="${k}">[${F[k].l}]</span>`:`<span class="f" data-f="${k}">${(OV&&OV[k])||F[k].v}</span>`;
const hd=(t,s,r)=>`<div class="hd"><div><h1>${t}</h1><small>${s||""}</small></div><div style="text-align:right"><span class="spec">${GEN?"Generic example":"Educational specimen"}</span><small>${r||""}</small></div></div>`;
const b=(n,l,c)=>`<div style="grid-column:span ${n}"><small>${l}</small>${c}</div>`;
const ft=t=>`<div class="foot">${t||"Fictional document created for a university exercise. It has no legal value and imitates no real approval, signature or stamp."}</div>`;
const goodsRow=()=>`<tr><td>1</td><td>${d("desc")}<br>HS / tariff code: ${d("hs")}<br>Country of origin: ${d("origin")}</td><td>${d("qty")}</td><td>${d("unit")}</td><td>${d("total")}</td></tr>`;
const DOCS={
 spec:{t:"Product specification sheet",lv:1,cls:"",r:()=>hd("PRODUCT SPECIFICATION SHEET",C.sup.name+" · technical data","Ref. PP-TDS-192A4")+`<div class="g">${b(6,"Product",d("desc"))+b(6,"Use","School exercise book for pupils")+b(4,"Format","A4, 21 × 29.7 cm")+b(4,"Pages","192 pages (96 sheets)")+b(4,"Binding","Stitched spine")+b(6,"Paper",d("gram"))+b(6,"Cover","Printed paper cover, 250 g/m² (no plastic)")+b(6,"Printing","Ruled lines only. No text, no calendar, no printed content")+b(6,"Standard claimed by the manufacturer",d("nm"))+b(4,"Packing",C.per+" notebooks per carton")+b(4,"Manufactured in",d("origin"))+b(4,"Customs tariff code","To be determined by the importer")}</div>`+ft()},
 card:{t:"Product information card",lv:1,r:()=>hd("PRODUCT CARD",C.imp.name+" · purchasing department","Item AS-NB-192")+`<table><tr><th>What is it?</th><td>${d("desc")}</td></tr><tr><th>What is it made of?</th><td>Paper (pages and cover)</td></tr><tr><th>What is it used for?</th><td>Writing exercises at school</td></tr><tr><th>Supplier</th><td>${d("seller")}</td></tr><tr><th>Quantity ordered</th><td>${d("qty")}</td></tr></table><p>Three questions decide the tariff classification: <b>what the product is</b>, <b>what it is made of</b> and <b>what it is used for</b>. Price, brand and colour do not.</p>`+ft()},
 adil:{t:"ADIL-style tariff result",lv:1,cls:"screen2",r:()=>hd("TARIFF INFORMATION (ADIL-STYLE SCREEN)","Simulated screen. The real tool is ADIL on douane.gov.ma","Consulted for the exercise")+`<div class="g">${b(4,"Tariff position",d("hs"))+b(8,"Description","Cahiers (exercise books) · Chapter 48, heading 48.20")}</div><table><tr><th>Duty / tax</th><th>What we could verify</th></tr><tr><td>Droit d'importation (DI), general rate</td><td><b>Not verified for this game.</b> Read it on ADIL. The calculator uses a training rate that is clearly labelled.</td></tr><tr><td>DI, EU origin with accepted proof</td><td>Preferential treatment under the EU–Morocco Association Agreement. The game uses 0% as the exercise rate. Confirm on ADIL.</td></tr><tr><td>Taxe parafiscale à l'importation (TPI)</td><td>0.25% of the customs value</td></tr><tr><td>TVA à l'importation</td><td>School supplies, including notebooks, are on the import-VAT exemption list when for school use (ADII circular of 22 Aug 2024, press report). Standard rate otherwise: 20%.</td></tr><tr><td>Controls</td><td>Conformity control: ${d("nm")}. A market-access authorisation is required for this tariff position.</td></tr></table>`+ft("Simulated educational screen. It is not an official ADIL extract and gives no binding tariff information.")},
 company:{t:"Company identification sheet",lv:2,r:()=>hd("COMPANY IDENTIFICATION","Importer profile (fictional)","Atlas Scolaire file")+`<div class="g">${b(6,"Company name",d("buyer"))+b(6,"Legal form","SARL (limited liability company)")+b(12,"Registered office",C.imp.addr)+b(6,"Registre de commerce",d("rc"))+b(6,"ICE",d("ice"))+b(6,"Activity","Wholesale of school and office supplies")+b(6,"Role in this operation","IMPORTER: buys the goods, holds the import title, owes the duties and taxes")}</div>`+ft("All identifiers are fictional placeholders.")},
 mandate:{t:"Customs broker mandate",lv:2,r:()=>hd("MANDATE TO THE CUSTOMS BROKER","Authorisation to declare on behalf of the importer","Shipment "+C.ref)+`<p>The importer ${d("buyer")} (${d("rc")}) authorises:</p><div class="g">${b(6,"Customs broker (transitaire agréé en douane)",d("broker"))+b(6,"Approval",d("agr"))+b(12,"Scope","Prepare and lodge the DUM in BADR for shipment "+C.ref+", follow controls and request the mainlevée")}</div><p>The importer stays responsible for the accuracy of the information it gives to the broker.</p><p style="margin-top:40px">Signature of the importer: <i>not signed · specimen</i></p>`+ft()},
 proforma:{t:"Pro forma invoice",lv:3,r:()=>hd("PRO FORMA INVOICE",C.sup.name+" · "+C.sup.addr,"No. "+C.n.pro+" · "+C.d.pro)+`<div class="g">${b(6,"Seller",d("seller"))+b(6,"Buyer",d("buyer")+"<br>"+C.imp.addr)+b(6,"Delivery term",d("incoterm"))+b(6,"Payment","Bank transfer after customs clearance, through the domiciliation bank")}</div><table><tr><th>#</th><th>Description</th><th>Quantity</th><th>Unit price</th><th>Amount</th></tr>${goodsRow()}</table><p>A pro forma is an offer. It is used to prepare the import title <b>before</b> the goods are shipped.</p>`+ft()},
 engagement:{t:"Import title (engagement d'importation)",lv:3,cls:"screen2",r:()=>hd("ENGAGEMENT D'IMPORTATION","Import title subscribed on PortNet · simulated form","No. "+C.n.ti+" · "+C.d.ti)+`<div class="g">${b(6,"Importer",d("buyer")+"<br>"+d("rc"))+b(6,"Foreign supplier",d("seller")+"<br>Portugal")+b(4,"Tariff code",d("hs"))+b(8,"Goods",d("desc"))+b(4,"Quantity",d("qty"))+b(4,"Value and currency",d("total"))+b(4,"Delivery term",d("incoterm"))+b(4,"Country of origin",d("origin"))+b(4,"Country of dispatch",d("dispatch"))+b(4,"Customs office","Casablanca-Port")+b(6,"Domiciliation bank",d("bank"))+b(6,"Domiciliation reference",C.n.dom)}</div><p>Type of title: <b>engagement d'importation</b> (goods that can be imported freely).</p>`+ft("Simulated PortNet form for teaching. Not an official import title.")},
 domic:{t:"Bank domiciliation notice",lv:3,r:()=>hd("DOMICILIATION NOTICE",C.bank,"Ref. "+C.n.dom)+`<div class="g">${b(6,"Client",d("buyer"))+b(6,"Import title",d("title"))+b(6,"Supplier",d("seller"))+b(6,"Amount",d("total"))+b(12,"Checks made by the bank","The commercial contract (pro forma) matches the import title · the payment terms respect the foreign-exchange rules")}</div><p>Payment to the supplier normally takes place <b>after</b> customs has charged (imputed) the import title.</p>`+ft()},
 invoice:{t:"Commercial invoice",lv:4,r:()=>hd("COMMERCIAL INVOICE",C.sup.name+" · "+C.sup.addr,"No. "+d("invno")+" · "+d("invdate"))+`<div class="g">${b(6,"Seller",d("seller")+"<br>"+C.sup.addr)+b(6,"Sold to",d("buyer")+"<br>"+C.imp.addr)+b(6,"Terms of sale",d("incoterm"))+b(6,"Currency","EUR (euro)")+b(6,"Mode of shipment","Sea freight, LCL · "+C.pol+" → "+C.pod)+b(6,"Import title",d("title"))}</div><table><tr><th>#</th><th>Product description and tariff code</th><th>Quantity</th><th>Unit price</th><th>Total price</th></tr>${goodsRow()}<tr><td colspan="4" style="text-align:right"><b>Total invoice value (FCA)</b></td><td>${d("total")}</td></tr></table><p>Freight and insurance are <b>not</b> included in this price (FCA).</p><p style="margin-top:30px">Signed for the seller: <i>not signed · specimen</i></p>`+ft()},
 packing:{t:"Packing list",lv:4,r:()=>hd("PACKING LIST / LISTE DE COLISAGE",C.sup.name,"No. "+C.n.pl+" · invoice "+C.n.inv)+`<div class="g">${b(6,"Exporter",d("seller"))+b(6,"Consignee",d("buyer"))+b(12,"Shipping marks","ATLAS SCOLAIRE / CASABLANCA / "+C.ref+" / C/No. 1–120")}</div><table><tr><th>Packages</th><th>Contents</th><th>Quantity</th><th>Net weight</th><th>Gross weight</th></tr><tr><td>${d("cartons")}<br>(${C.per} notebooks each)</td><td>${d("desc")}</td><td>${d("qty")}</td><td>${d("net")}</td><td>${d("gross")}</td></tr></table><p>Observations: keep dry. Cartons stacked on 2 pallets.</p>`+ft()},
 bl:{t:"Ocean bill of lading",lv:4,r:()=>hd("BILL OF LADING",C.car,"B/L No. "+d("blno")+" · "+C.d.bl)+`<div class="g">${b(6,"Shipper",d("seller"))+b(6,"Consignee",d("buyer"))+b(6,"Notify party",C.brk.name)+b(6,"Vessel",d("vessel"))+b(6,"Port of loading",d("pol"))+b(6,"Port of discharge",d("pod"))+b(4,"Container",C.n.ctr)+b(4,"Packages",d("cartons"))+b(4,"Gross weight",d("gross"))+b(12,"Description of goods (as declared by the shipper)","School notebooks, paper · Freight payable at destination")}</div><p>The B/L is the transport contract, a receipt for the goods and the document that gives the right to collect them.</p>`+ft()},
 eur1:{t:"EUR.1 movement certificate (specimen)",lv:4,cls:"green",r:()=>hd("MOVEMENT CERTIFICATE EUR.1 · SPECIMEN","Teaching reconstruction · not issued by any customs authority",C.n.eur)+`<div class="g">${b(6,"1. Exporter",d("seller")+"<br>"+C.sup.addr)+b(6,"2. Certificate used in preferential trade between","EUROPEAN UNION and KINGDOM OF MOROCCO")+b(6,"3. Consignee (optional)",d("buyer"))+b(3,"4. Country of origin",d("pref"))+b(3,"5. Country of destination","Morocco")+b(6,"6. Transport details (optional)","Sea · "+C.pol+" → "+C.pod)+b(6,"7. Remarks","Invoice "+C.n.inv)+b(8,"8. Marks, number and kind of packages, description of goods",d("cartons")+" · "+d("desc"))+b(2,"9. Gross mass",d("gross"))+b(2,"10. Invoices",d("invno"))+b(6,"11. Customs endorsement","RESERVED FOR THE CUSTOMS OF THE EXPORTING COUNTRY · left empty in this specimen")+b(6,"12. Declaration by the exporter","Not signed · specimen")}</div>`+ft("A real EUR.1 is issued and endorsed by the customs authorities of the exporting country. This specimen carries no stamp, number or signature.")},
 originsup:{t:"Supplier's origin statement",lv:4,r:()=>hd("MANUFACTURER'S STATEMENT",C.sup.name+" · production records","Ref. PP-ORI-014")+`<p>We state that the goods below were manufactured in our plant in Porto, Portugal:</p><div class="g">${b(8,"Goods",d("desc"))+b(4,"Quantity",d("qty"))+b(6,"Place of manufacture","Porto, "+d("origin"))+b(6,"Production batch","LOT-FICT-2026-09")}</div><p>This statement and the production records <b>support</b> the request for a proof of origin. They do not replace the proof of origin itself.</p>`+ft()},
 freightinv:{t:"Freight invoice",lv:4,r:()=>hd("FREIGHT INVOICE",C.car,"No. "+C.n.frt)+`<div class="g">${b(6,"Billed to",d("buyer"))+b(6,"B/L",d("blno"))+b(8,"Service","Sea freight LCL, "+C.pol+" → "+C.pod)+b(4,"Amount",d("freight"))}</div><p>Under FCA the buyer pays this cost, so it is not in the supplier's invoice.</p>`+ft()},
 insurance:{t:"Insurance certificate",lv:4,r:()=>hd("CARGO INSURANCE CERTIFICATE","Assurances du Large (fictional insurer)","Policy "+C.n.pol)+`<div class="g">${b(6,"Insured",d("buyer"))+b(6,"Voyage",C.pol+" → "+C.pod)+b(8,"Goods insured",d("cartons")+" · school notebooks")+b(4,"Premium",d("insurance"))}</div>`+ft()},
 manifest:{t:"Cargo manifest (extract)",lv:5,cls:"screen2",r:()=>hd("CARGO MANIFEST · EXTRACT",C.car+" · "+C.vessel,"Voyage FICT-26W42")+`<table><tr><th>B/L</th><th>Shipper</th><th>Consignee</th><th>Packages</th><th>Gross weight</th><th>Goods</th></tr><tr><td>${d("blno")}</td><td>${d("seller")}</td><td>${d("buyer")}</td><td>${d("cartons")}</td><td>${d("gross")}</td><td>School notebooks</td></tr><tr><td style="color:#888">ABL-…-0043</td><td style="color:#888" colspan="5">(other shippers' cargo on the same vessel)</td></tr></table><p>The manifest lists <b>all</b> the cargo on board. It is prepared by the carrier, not by the importer.</p>`+ft()},
 ds:{t:"Déclaration sommaire",lv:5,cls:"screen2",r:()=>hd("DÉCLARATION SOMMAIRE","Summary declaration lodged electronically by the carrier or its agent · simulated","No. "+d("dsno")+" · "+C.d.arr)+`<div class="g">${b(6,"Declared by","Shipping agent of "+C.car)+b(6,"Vessel",d("vessel"))+b(4,"Port of discharge",d("pod"))+b(4,"B/L",d("blno"))+b(4,"Consignee",d("buyer"))+b(4,"Packages",d("cartons"))+b(4,"Gross weight",d("gross"))+b(4,"Goods","School notebooks")}</div><p>The DS places the cargo under customs supervision. It does <b>not</b> classify, value or clear the goods: that is the job of the DUM.</p>`+ft()},
 arrival:{t:"Arrival notice",lv:5,r:()=>hd("ARRIVAL NOTICE","Shipping agent of "+C.car,C.d.arr)+`<p>To: ${d("buyer")} · Notify: ${C.brk.name}</p><div class="g">${b(6,"Vessel",d("vessel"))+b(6,"Arrived at",d("pod"))+b(6,"B/L",d("blno"))+b(6,"Cargo",d("cartons")+" · "+d("gross"))+b(12,"Next steps","Lodge the DUM · pay local charges · obtain the delivery order (bon à délivrer) after customs release")}</div>`+ft()},

 valuation:{t:"Customs value calculation sheet",lv:7,r:()=>hd("CUSTOMS VALUE SHEET",C.brk.name+" · working paper","Shipment "+C.ref)+`<table><tr><th>Element</th><th>Source document</th><th>Amount</th></tr><tr><td>Invoice price (FCA)</td><td>Commercial invoice</td><td>${d("total")}</td></tr><tr><td>+ Sea freight</td><td>Freight invoice</td><td>${d("freight")}</td></tr><tr><td>+ Insurance</td><td>Insurance certificate</td><td>${d("insurance")}</td></tr><tr><th colspan="2">Value at the Moroccan border (CIF-type)</th><th>EUR ${gf(CIF,2)}</th></tr><tr><td colspan="2">Exchange rate</td><td>${d("rate")}</td></tr><tr><th colspan="2">Customs value</th><th>${d("cv")}</th></tr></table><table><tr><th>Duty / tax</th><th>Base</th><th>Rate</th><th>Amount</th></tr><tr><td>DI (EU preference accepted)</td><td>Customs value</td><td>0% (exercise rate)</td><td>MAD 0.00</td></tr><tr><td>TPI</td><td>Customs value</td><td>0.25%</td><td>${d("tpi")}</td></tr><tr><td>TVA à l'importation</td><td>Customs value + DI + TPI</td><td>Exempt (school supplies, school use)</td><td>MAD 0.00</td></tr><tr><th colspan="3">Total (scenario A)</th><th>MAD ${gf(TOTA,2)}</th></tr></table><p>Illustrative figures. The real value must be checked against the Moroccan valuation rules and the rates read on ADIL.</p>`+ft()},
 testrep:{t:"Supplier's test report",lv:8,r:()=>hd("LABORATORY TEST REPORT","Supplied by the manufacturer · fictional laboratory","Report LAB-FICT-2231")+`<table><tr><th>Characteristic</th><th>Result</th></tr><tr><td>Paper grammage</td><td>70 g/m²</td></tr><tr><td>Pulp</td><td>Virgin pulp</td></tr><tr><td>Format</td><td>A4</td></tr><tr><td>Number of pages</td><td>192</td></tr><tr><td>Standard used as reference</td><td>${d("nm")}</td></tr></table><p>A test report from the supplier helps the file. The Moroccan control services decide whether it is enough or whether samples must be tested.</p>`+ft()},

 what:"Avant d'acheter, l'importateur identifie précisément le produit et trouve sa position dans le tarif douanier marocain. Nos cahiers relèvent de la position 48.20 ; la position marocaine des cahiers est <b>4820.20.00.00</b>.",
 why:"Le code tarifaire décide de presque tout : le droit d'importation, les taxes, la nécessité éventuelle d'une licence et les contrôles à la frontière.",
 who:"L'importateur (Atlas Scolaire), en général avec son transitaire. La douane peut vérifier et corriger le classement.",
 plat:"<b>ADIL</b> (Assistance au Dédouanement des marchandises à l'Importation en Ligne), l'outil de consultation gratuit de la douane marocaine (ADII).",
 info:"Description du produit → code tarifaire → droits, taxes et contrôles exigés.",
 next:"Avec le code, l'importateur connaît le coût et les formalités et peut préparer le titre d'importation.",
 ma:"ADIL donne la position marocaine à 10 chiffres avec DI, TPI, TVA et contrôles.",us:"L'importateur utilise le HTSUS (10 chiffres) publié par l'USITC. S'y ajoutent les droits, la Merchandise Processing Fee et la Harbor Maintenance Fee.",
 note:"Nous n'avons pas pu ouvrir ADIL depuis nos outils de recherche : le taux général du DI pour cette position n'est donc <b>pas vérifié</b>. Lisez-le sur ADIL avant d'utiliser des chiffres réels."},
{t:"Qui importe ?",k:"PRÉPARER L'IMPORTATEUR",bn:"Importateur & transitaire",
 what:"L'importateur doit exister juridiquement : il est inscrit au <b>registre de commerce (RC)</b> et possède un <b>ICE</b> (Identifiant Commun de l'Entreprise). Il choisit un <b>transitaire agréé en douane</b> et lui donne mandat.",
 why:"La douane, la banque et PortNet doivent savoir qui est responsable de la marchandise, qui doit les droits et qui peut signer la déclaration.",
 who:"Importateur : Atlas Scolaire SARL. Déclarant : Transit Al Marsa SARL (transitaire fictif).",
 plat:"Compte PortNet de l'importateur · accès BADR du déclarant.",
 info:"RC et ICE de l'importateur · numéro d'agrément du transitaire.",
 next:"L'importateur peut maintenant souscrire un titre d'importation sur PortNet.",
 ma:"RC + ICE identifient l'importateur. Un transitaire agréé déclare dans BADR sous mandat.",us:"Un Importer of Record identifié par un numéro IRS/EIN, une caution douanière (bond) et le plus souvent un courtier agréé agissant par procuration."},
{t:"Obtenir le titre d'importation",k:"PORTNET ET LA BANQUE",bn:"PortNet & banque",
 what:"Toute importation commerciale exige un <b>titre d'importation</b>. Pour les marchandises libres à l'importation, c'est un <b>engagement d'importation</b>. Il est souscrit sur <b>PortNet</b> et <b>domicilié auprès d'une banque</b>. D'autres titres existent : la <b>licence d'importation</b> pour les marchandises soumises à restriction, et la <b>déclaration préalable d'importation</b>, utilisée dans des cas précis fixés par le ministère du commerce (non détaillée ici : nous n'avons pas pu vérifier son champ exact).",
 why:"Le Maroc applique une réglementation des changes. Le titre d'importation permet à la banque de payer le fournisseur étranger et à la douane de rattacher la marchandise entrée à ce paiement.",
 who:"Importateur (souscrit) · banque (domicilie et vérifie le contrat et les conditions de paiement) · Office des Changes (fixe les règles) · ministère chargé du commerce (licences).",
 plat:"<b>PortNet</b>, le guichet unique national du commerce extérieur.",
 info:"Importateur, fournisseur, marchandise, code tarifaire, valeur, devise, Incoterm, banque.",
 next:"La douane <b>imputera</b> plus tard le titre lors du dédouanement. Le paiement intervient normalement après cette imputation.",
 ma:"Titre d'importation sur PortNet + domiciliation bancaire, selon les règles de l'Office des Changes.",us:"Pas de titre d'importation général ni de domiciliation bancaire. L'importateur a surtout besoin d'une caution douanière et, en maritime, d'un ISF déposé avant le chargement.",
 note:"Les cahiers ne figuraient pas sur la liste des produits soumis à licence dans l'examen OMC de 2024. La validité de 6 mois du titre vient d'un ancien guide ministériel : vérifiez la règle en vigueur."},
{t:"Préparer l'expédition",k:"DOCUMENTS COMMERCIAUX ET DE TRANSPORT",bn:"Bureau des documents",
 what:"Le fournisseur prépare les documents commerciaux et remet la marchandise au transporteur. En <b>FCA Leixões</b>, le vendeur livre au transporteur au terminal ; l'acheteur paie le fret maritime et l'assurance. L'exportateur obtient aussi la <b>preuve d'origine</b>.",
 why:"La douane dédouane sur documents. Trois notions à ne pas confondre : le <b>pays de provenance</b> (d'où la marchandise est expédiée), le <b>pays d'origine</b> (où elle est fabriquée) et l'<b>origine préférentielle</b> (origine qui remplit les règles d'un accord et qui est prouvée).",
 who:"Fournisseur (facture, liste de colisage, justificatifs d'origine) · transporteur (connaissement, facture de fret) · assureur · douane du pays d'exportation (EUR.1).",
 plat:"Les documents sont échangés par e-mail puis joints à la DUM dans BADR.",
 info:"Vendeur, acheteur, prix, Incoterm, quantité, poids, référence du transport, origine.",
 next:"Le navire quitte Leixões. Le transitaire prépare la déclaration pendant que la marchandise est en mer.",
 ma:"La préférence de l'Accord d'association UE–Maroc exige un EUR.1 (ou EUR-MED), ou une déclaration d'origine. Au-delà de 6 000 EUR, la déclaration d'origine est réservée aux exportateurs agréés. Notre facture fait 7 200 EUR.",us:"Pas d'EUR.1. Avec l'ALE États-Unis–Maroc, l'importateur revendique lui-même la préférence et conserve des justificatifs à présenter sur demande.",
 note:"Les règles d'origine entre l'UE et le Maroc évoluent (Convention PEM révisée). Vérifiez quelles règles et quelle preuve s'appliquent le jour de l'importation. L'origine compte aussi hors préférences : les cahiers originaires de Tunisie ont fait l'objet d'un droit antidumping au Maroc."},
{t:"Arrivée au port de Casablanca",k:"LA MARCHANDISE ARRIVE AU MAROC",bn:"Agent portuaire",
 what:"Le navire arrive. Le transporteur (ou son agent) déclare toute la cargaison avec le <b>manifeste</b> et la <b>déclaration sommaire (DS)</b>. La marchandise est déchargée et attend au terminal sous surveillance douanière.",
 why:"La douane doit savoir ce qui est entré sur le territoire avant que quiconque ne le déclare en détail. La DS est le « document précédent » auquel la DUM se référera.",
 who:"Transporteur maritime et agent maritime · exploitant du port / terminal · douane (ADII).",
 plat:"La DS est enregistrée électroniquement et alimente PortNet, où le bon à délivrer est créé.",
 info:"Navire, numéro de connaissement, colis, poids brut, destinataire.",
 next:"Le transitaire dépose la DUM pour nos 120 cartons.",
 ma:"Le manifeste et la DS sont des documents du transporteur. La DUM est la déclaration de l'importateur.",us:"Le transporteur dépose le manifeste dans AMS et l'importateur dépose l'ISF « 10+2 » avant le chargement. L'entry est ensuite déposée dans ACE."},
{t:"Déclarer sa marchandise",k:"REMPLIR LA DUM DANS BADR",bn:"Bureau BADR",
 what:"Le transitaire remplit la <b>DUM</b> (Déclaration Unique de Marchandises) dans <b>BADR</b>, joint les documents et signe électroniquement. Notre régime est l'importation définitive pour la consommation (<b>mise à la consommation</b>).",
 why:"La DUM est la déclaration légale : elle indique la nature de la marchandise, sa valeur, son origine et le régime demandé. Le déclarant est responsable de son contenu.",
 who:"Le transitaire (déclarant) pour l'importateur. La douane enregistre et analyse la déclaration.",
 plat:"<b>BADR</b> (Base Automatisée des Douanes en Réseau), le système de dédouanement de l'ADII.",
 info:"Chaque case de la DUM provient d'un document du dossier. Ouvrez l'Explorateur DUM pour voir d'où vient chacune.",
 next:"BADR enregistre la DUM, calcule les droits et applique la sélectivité (quels contrôles ?).",
 ma:"Une DUM dans BADR, déposée par le transitaire, avec signature électronique.",us:"Entry et entry summary (formulaires CBP 3461 et 7501) déposés électroniquement dans ACE par le courtier."},
{t:"Calculer la note de droits",k:"VALEUR EN DOUANE ET DROITS",bn:"Bureau des paiements",
 what:"Les droits sont calculés sur la <b>valeur en douane</b>. Le Maroc utilise la valeur transactionnelle et perçoit les droits ad valorem sur une base CAF : prix + fret + assurance jusqu'à la frontière marocaine. Viennent ensuite le <b>droit d'importation (DI)</b>, la <b>taxe parafiscale à l'importation (TPI, 0,25 %)</b> et la <b>TVA à l'importation</b>. Certains produits supportent aussi une TIC : pas les cahiers.",
 why:"L'Incoterm indique ce qui manque au prix facturé. En FCA, le fret et l'assurance ne sont pas dans le prix : on les ajoute.",
 who:"Le transitaire calcule ; BADR liquide ; l'importateur paie (ou fournit une garantie).",
 plat:"BADR calcule les montants ; le paiement se fait en ligne par plusieurs canaux.",
 info:"Valeur 8 100 EUR × 11 = 89 100 MAD (taux de l'exercice). Base TVA = valeur en douane + DI + TPI.",
 next:"Une fois la note payée ou garantie, seuls les contrôles nous séparent de la mainlevée.",
 ma:"Valeur de type CAF. DI + TPI 0,25 % + TVA. Avec une preuve d'origine UE acceptée, le DI préférentiel s'applique.",us:"La valeur exclut en général le fret et l'assurance internationaux. Droits + MPF + HMF (maritime). Pas de TVA à l'import.",
 note:"<b>Ce qui est vérifié :</b> base CAF, TPI 0,25 % (y compris sur les importations préférentielles), assiette de la TVA, taux normal de TVA 20 %, cahiers scolaires sur la liste d'exonération de TVA à l'import pour usage scolaire (article de presse sur une circulaire ADII). <b>Ce qui ne l'est pas :</b> le taux général du DI pour 4820.20.00.00. Le jeu utilise 40 % comme <b>taux d'entraînement uniquement</b>, et 0 % comme taux de l'exercice sous préférence UE."},
{t:"Le contrôle douanier",k:"CONTRÔLES",bn:"Zone de contrôle",
 what:"BADR oriente chaque déclaration vers un circuit : <b>vert</b> (mainlevée immédiate), <b>orange</b> ou <b>rouge</b> (contrôles plus poussés : documents, puis marchandise). En parallèle, certains produits exigent le contrôle d'une autre autorité. Les <b>cahiers scolaires</b> figurent sur la liste du ministère de l'Industrie des produits contrôlés à l'arrivée au Maroc (normes NM 04.4.002 / NM 04.4.003), et une <b>autorisation d'accès au marché</b> est exigée pour la position 4820.20.00.00.",
 why:"La douane vérifie que la déclaration est exacte. Le contrôle de conformité protège les consommateurs : ici, des élèves.",
 who:"ADII (contrôle douanier) · Ministère de l'Industrie et du Commerce (conformité des produits industriels) · ONSSA (aliments, végétaux, animaux : <b>non</b> concerné par les cahiers).",
 plat:"La demande de conformité passe par <b>PortNet</b> ; le résultat revient automatiquement au bureau de douane.",
 info:"Étapes du contrôle de conformité : contrôle documentaire → contrôle physique → prélèvement → autorisation d'accès au marché.",
 next:"Contrôles clôturés et note réglée : le transitaire demande la mainlevée.",
 ma:"Circuits douaniers + contrôle de conformité des cahiers à l'arrivée, avec autorisation d'accès au marché.",us:"La CBP peut examiner la marchandise ; d'autres agences (par exemple la CPSC pour les produits de consommation) ont leurs propres règles.",
 note:"Ne supposez pas un certificat de conformité délivré à l'étranger : pour les cahiers, le contrôle a lieu à l'arrivée au Maroc. Le sens exact des circuits orange et rouge est simplifié ici."},
{t:"La marchandise est libérée",k:"MAINLEVÉE ET LIVRAISON",bn:"Barrière de sortie",
 what:"Quand la déclaration est acceptée, les contrôles clôturés et les droits payés ou garantis, la douane accorde la <b>mainlevée</b>, l'autorisation d'enlever la marchandise (bon à enlever). L'importateur a encore besoin du <b>bon à délivrer</b> du transporteur et doit régler les frais du terminal avant que le camion passe la barrière.",
 why:"Mainlevée douanière et livraison physique sont deux choses différentes : l'une est donnée par la douane, l'autre par le transporteur et le terminal.",
 who:"Douane (mainlevée) · agent maritime (bon à délivrer) · terminal (sortie) · transporteur routier (livraison).",
 plat:"BADR (mainlevée demandée et suivie en ligne) · PortNet (bon à délivrer).",
 info:"Numéro de DUM, référence de paiement, connaissement, colis et poids.",
 next:"Après la livraison : la banque paie le fournisseur sur la base du titre imputé, et l'importateur conserve son dossier pour d'éventuels contrôles a posteriori.",
 ma:"Mainlevée dans BADR, puis bon à délivrer et sortie du port.",us:"Release CBP dans ACE, puis enlèvement au terminal ; l'entry summary et les droits suivent peu après."}],

PH:[
["Avant l'achat / l'expédition","Vérification du produit et classement sur ADIL · importateur identifié (RC, ICE) · choix du transitaire · titre d'importation sur PortNet · domiciliation bancaire.","Ces étapes peuvent se dérouler en parallèle."],
["Avant le départ","Le fournisseur prépare facture et liste de colisage · l'exportateur obtient la preuve d'origine · réservation du transporteur · souscription de l'assurance.",""],
["Pendant le transport","Le transporteur émet le connaissement · le transitaire reçoit les copies et prépare la DUM · le dossier de conformité peut être préparé.","La préparation de la DUM n'attend pas le navire."],
["À l'arrivée","Manifeste et déclaration sommaire par le transporteur · marchandise déchargée et stockée sous surveillance douanière.",""],
["Déclaration en douane","DUM déposée dans BADR avec les justificatifs et signée électroniquement.","Le Maroc encourage aussi le dédouanement par anticipation (avant l'arrivée) dans certains cas."],
["Contrôles et taxes","Circuit douanier (vert / orange / rouge) · contrôle de conformité des cahiers · droits et taxes payés ou garantis.","Contrôle douanier, contrôle de conformité et paiement se chevauchent."],
["Mainlevée","Mainlevée · bon à délivrer · frais du terminal · barrière de sortie · livraison à l'entrepôt.",""],
["Après l'importation","Imputation douanière du titre d'importation · la banque paie le fournisseur et déclare le paiement sur PortNet · dossier conservé pour les contrôles a posteriori.","Les paiements sont déclarés sur PortNet sous trois jours ouvrables (IGOC)."]],
WHY:{seller:"La douane doit savoir qui a envoyé la marchandise.",buyer:"La douane doit savoir qui est responsable de l'importation et qui doit les droits.",rc:"Prouve que l'importateur est une entreprise immatriculée.",broker:"Indique qui dépose et signe la déclaration.",agr:"Seul un déclarant agréé peut déclarer pour le compte d'autrui.",cartons:"Permet à la douane d'identifier et de compter la marchandise.",gross:"Sert à identifier la marchandise et à recouper le manifeste.",net:"Sert aux statistiques et aux marchandises taxées au poids.",dispatch:"Statistiques commerciales et analyse de risque.",origin:"L'origine décide si une préférence ou une mesure de défense commerciale s'applique.",incoterm:"Indique quels coûts sont déjà inclus dans le prix facturé.",blno:"Relie la déclaration à la marchandise arrivée.",vessel:"Identifie le moyen de transport.",total:"Point de départ de la valeur en douane.",freight:"Doit être ajouté au prix en FCA.",insurance:"Doit être ajoutée au prix en FCA.",cv:"Base de calcul des droits et taxes.",hs:"Décide des taux et des contrôles.",desc:"Doit correspondre au code tarifaire et à la facture.",qty:"Statistiques et contrôles de cohérence.",dsno:"Relie la DUM à la déclaration sommaire qui a placé la marchandise sous surveillance douanière.",title:"La douane impute le titre d'importation pour que la banque puisse ensuite payer le fournisseur.",bank:"Relie l'opération douanière au dossier de change.",tpi:"Indique le montant à payer.",pod:"Détermine le bureau de douane compétent.",rate:"Convertit la devise étrangère en dirhams.",regime:"Détermine le traitement juridique de la marchandise."},

 gram:{l:"Papier",m:"Caractéristiques techniques du papier.",u:"Contrôle de conformité par rapport à la norme · confirme la description utilisée pour le classement."},

LV:[
{t:"Classer la marchandise",steps:[
 {say:"Bienvenue à bord ! Avant d'acheter quoi que ce soit, il faut trouver la position tarifaire. Ouvrez la fiche technique, puis cherchez dans notre ADIL simplifié.",q:"Cherchez dans le tarif et sélectionnez la bonne ligne pour notre produit.",
  lines:[[null,"Papiers non couchés pour l'écriture ou l'impression, en rouleaux ou en feuilles"],[null,"Registres, livres comptables, carnets de notes, de commandes, blocs-notes, agendas et articles similaires"],[null,"Cahiers"],[null,"Classeurs, reliures, chemises et couvertures à dossiers"],[null,"Autres articles de la position 48.20"],[null,"Livres, brochures et imprimés similaires"]],
  hint:"Notre produit est un cahier d'écolier à pages réglées.",ok:"4820.20.00.00 couvre les cahiers. C'est la position citée dans les textes officiels marocains sur les cahiers.",no:"Regardez à nouveau ce qu'EST le produit : un cahier réglé pour élèves. Pas du papier en feuilles, pas un agenda, pas un livre imprimé."},
 {say:"Bien. Dites-moi maintenant ce qui détermine vraiment un classement.",q:"Quelle information décide du classement tarifaire ?",opts:["Ce qu'est le produit, sa matière et son usage","Son prix et l'Incoterm","La marque et la couleur de la couverture","Le pays du fournisseur"],hint:"Regardez la fiche produit : trois questions.",ok:"Le classement dépend de la nature, de la matière et de l'usage du produit. Le prix et l'origine comptent plus tard, pour la valeur et les préférences.",no:"Le prix, la marque et le pays du fournisseur ne changent pas ce qu'est le produit."},
 {say:"Dernière vérification avant de continuer.",q:"Que nous apporte ADIL pour une position tarifaire ?",opts:["Les droits, taxes et contrôles applicables, à titre d'information","Une mainlevée pour la marchandise","Un titre d'importation","Une décision contraignante que la douane ne peut jamais contester"],hint:"ADIL est un outil de consultation.",ok:"ADIL informe : DI, TPI, TVA, taux préférentiels et contrôles exigés. Il ne dépose et n'autorise rien.",no:"ADIL est un outil d'information. La déclaration se fait plus tard, dans BADR."}]},
{t:"Identifier l'importateur",steps:[
 {say:"Deux sociétés apparaissent dans notre dossier. La douane doit savoir qui fait quoi.",q:"Envoyez chaque élément à la bonne partie.",buckets:["Importateur (Atlas Scolaire)","Transitaire (Transit Al Marsa)"],items:[["Registre de commerce et ICE de l'acheteur"],["Agrément (numéro d'agrément douanier)"],["Détient le titre d'importation et doit les droits"],["Dépose et signe la DUM dans BADR"],["Donne le mandat"],["Reçoit le mandat"]],hint:"L'importateur possède la marchandise et paie. Le transitaire déclare pour lui.",ok:"L'importateur est identifié par son RC et son ICE et reste responsable de l'importation. Le transitaire agréé déclare pour son compte sous mandat.",no:"Regardez le mandat : qui autorise qui ?"},
 {say:"Bonjour. Qui a le droit d'importer à titre commercial ?",q:"Que doit avoir une entreprise avant d'importer des marchandises destinées à la revente ?",opts:["Une inscription au registre de commerce (et un ICE)","Seulement une carte d'identité personnelle","Une caution douanière américaine","Rien : n'importe qui peut importer n'importe quelle quantité pour revendre"],hint:"Regardez la fiche d'identification de la société.",ok:"Un importateur commercial doit être inscrit au registre de commerce et dispose d'un ICE. Ces identifiants figurent sur PortNet et dans la DUM.",no:"Les importations commerciales sont réalisées par des entreprises immatriculées."}]},
{t:"Créer le titre d'importation",steps:[
 {say:"Bienvenue à la banque. Avant que je puisse payer Porto Paperworks, il vous faut un titre d'importation.",q:"Les cahiers scolaires sont libres à l'importation. Quel titre souscrivons-nous sur PortNet ?",opts:[null,null,null,"Aucun titre n'est nécessaire pour une importation commerciale"],hint:"La licence concerne les marchandises soumises à restriction.",ok:"Pour les marchandises libres à l'importation, le titre est l'engagement d'importation. Il est souscrit sur PortNet et domicilié auprès d'une banque.",no:"La licence concerne les marchandises soumises à restriction et la déclaration préalable est réservée à des cas précis. Les cahiers n'ont besoin ni de l'une ni de l'autre."},
 {skin:"PORTNET · titre d'importation (simulé)",say:"Remplissez le formulaire à partir de la facture pro forma. Chaque champ doit correspondre aux documents.",q:"Complétez le titre d'importation.",fields:[["Importateur"],["Fournisseur étranger"],["Code tarifaire"],["Valeur et devise"],["Condition de livraison"],["Type de titre"]],okB:"TITRE D'IMPORTATION PRÊT POUR LA DOMICILIATION",noB:"FORMULAIRE INCOMPLET OU INCOHÉRENT",hint:"Le titre reprend le prix de la marchandise sur la pro forma : 7 200 EUR FCA.",ok:"Le titre reprend les données commerciales : importateur, fournisseur, marchandise, valeur et Incoterm. La banque le comparera avec la pro forma.",no:"Comparez chaque champ avec la facture pro forma et la fiche de la société."},
 {say:"Une dernière chose sur mon rôle.",q:"Que fait la banque quand elle domicilie le titre d'importation ?",opts:["Elle vérifie que le contrat correspond au titre et que les conditions de paiement respectent la réglementation des changes","Elle classe la marchandise","Elle accorde la mainlevée","Elle inspecte les cartons"],hint:"La banque s'occupe du paiement, pas de la marchandise.",ok:"La banque vérifie le contrat commercial au regard du titre et des conditions de paiement. Le paiement intervient normalement après l'imputation du titre par la douane.",no:"Le classement et la mainlevée relèvent de la douane."}]},
{t:"Documents et origine",steps:[
 {say:"Olá ! Les cartons sont prêts à Porto. Quels papiers voulez-vous de notre part pour votre dossier douanier ?",q:"Sélectionnez tous les documents qui ont leur place dans le dossier d'importation de cette expédition (6 documents).",opts:[["Facture commerciale"],["Liste de colisage"],["Connaissement maritime"],["Preuve d'origine EUR.1"],["Facture de fret"],["Certificat d'assurance"],["Certificat sanitaire ONSSA"],["Lettre de transport aérien"],["Brochure publicitaire du fournisseur"]],hint:"Transport maritime, produits en papier, FCA, préférence UE.",ok:"Facture, liste de colisage et connaissement forment le noyau. La facture de fret et l'assurance complètent la valeur en douane en FCA. L'EUR.1 appuie la préférence.",no:"Pensez à notre cas : transport maritime (pas de LTA), des cahiers (pas de certificat sanitaire)."},
 {say:"On confond souvent trois notions sur les pays. Je vous teste.",q:"Associez chaque affirmation à la bonne notion.",buckets:["Pays de provenance","Pays d'origine","Origine préférentielle"],items:[["Les cartons ont été chargés sur le navire à Leixões, au Portugal"],["Les cahiers ont été fabriqués dans une usine à Porto"],["Un EUR.1 accepté montre que la marchandise remplit les règles de l'accord UE–Maroc"],["Si le navire était parti d'Espagne, ceci changerait, mais pas l'usine"]],hint:"Provenance = expédié depuis. Origine = fabriqué à. Préférentielle = prouvée dans le cadre d'un accord.",ok:"La provenance concerne le transport, l'origine la fabrication, l'origine préférentielle le respect des règles d'un accord et sa preuve.",no:"Le lieu d'expédition n'est pas toujours le lieu de fabrication."},
 {say:"Notre facture fait 7 200 EUR. Je ne suis pas exportateur agréé.",q:"Quelle preuve d'origine préférentielle convient à cette expédition ?",opts:["Un certificat de circulation EUR.1 visé par la douane du pays d'exportation","Une simple phrase écrite sur la facture par n'importe quel exportateur","Le connaissement","Aucune preuve : le Portugal est dans l'UE, cela suffit"],hint:"La déclaration d'origine par n'importe quel exportateur est limitée à 6 000 EUR.",ok:"Au-delà de 6 000 EUR, la déclaration d'origine est réservée aux exportateurs agréés : Rui demande donc un EUR.1 à sa douane.",no:"Une préférence doit être prouvée par une preuve d'origine acceptée."},
 {say:"Attendez. J'ai reçu une première version de la liste de colisage. Comparez-la avec la facture.",q:"REPÉREZ L'ERREUR : que faut-il vérifier avant de déposer la DUM ?",opts:["La quantité : la facture indique 2 400 et la liste de colisage 2 600","Le nom du vendeur","Le poids brut","Rien, les documents concordent"],hint:"Surlignez la quantité sur les deux documents.",ok:"Des documents contradictoires retardent le dédouanement : la douane peut demander des explications ou contrôler la marchandise. Le fournisseur a corrigé la liste à 2 400.",no:"Ouvrez les deux documents et comparez la quantité."},
 {say:"Et l'Incoterm ?",q:"En FCA Leixões, qui paie le fret maritime jusqu'à Casablanca ?",opts:["L'acheteur : il faut donc ajouter le fret pour obtenir la valeur en douane","Le vendeur : il est donc déjà dans le prix facturé","Le transitaire","Personne : le fret est gratuit en FCA"],hint:"FCA : la mission du vendeur s'arrête quand il remet la marchandise au transporteur.",ok:"En FCA, l'acheteur paie le transport principal et l'assurance. Ils ne sont pas sur la facture : on les ajoute pour la valeur en douane.",no:"Lisez la facture : fret et assurance ne sont pas inclus."}]},
{t:"Arrivée de la marchandise",steps:[
 {say:"Le Zellige Wave est à quai ! Regardez mon écran : quatre documents, deux types d'acteurs derrière.",q:"Qui est responsable de chaque document ?",buckets:["Transporteur / agent maritime","Importateur / transitaire"],items:[["Manifeste"],["Déclaration sommaire (DS)"],["Connaissement (émis par)"],["DUM"]],hint:"Un seul d'entre eux est la déclaration en douane de l'importateur.",ok:"Le manifeste, la DS et le connaissement viennent du côté du transporteur. La DUM est la déclaration en détail de l'importateur, déposée par le transitaire.",no:"Le transporteur déclare tout le navire. L'importateur déclare sa propre marchandise."},
 {say:"TROUVEZ L'INFORMATION. La douane m'interroge sur votre marchandise.",q:"Ouvrez le manifeste : combien de colis et quel poids brut sont enregistrés pour notre connaissement ?",hint:"Le poids brut inclut l'emballage.",ok:"120 cartons et 1 050 kg bruts : identiques sur le connaissement, le manifeste, la DS et bientôt la DUM.",no:"Vérifiez la ligne du manifeste pour le connaissement ABL-LEI-CAS-0042."},
 {say:"La DS est enregistrée. Certains importateurs croient que c'est fini.",q:"À quoi sert la déclaration sommaire ?",opts:["Elle place la marchandise sous surveillance douanière jusqu'au dépôt d'une DUM","Elle dédouane la marchandise pour la vente au Maroc","Elle calcule les droits et taxes","Elle remplace le titre d'importation"],hint:"Sommaire, pas détaillée.",ok:"La DS identifie la marchandise et la place sous surveillance douanière. Le classement, la valeur et les taxes viennent avec la DUM, qui cite la DS comme document précédent.",no:"La DS ne classe et n'évalue rien."}]},
{t:"Remplir la DUM",steps:[
 {skin:"BADR · déclaration en détail (simulée)",say:"Votre transitaire est au terminal BADR. Remplissez les cases manquantes à partir des documents de votre dossier. Saisissez les poids lus sur la liste de colisage.",q:"Complétez la DUM.",fields:[null,null,null,null,[null,["Maroc","Portugal","Espagne"]]],okB:"DONNÉES DE LA DUM VALIDÉES",noB:"LA DÉCLARATION DOIT ÊTRE CORRIGÉE",hint:"Les poids viennent de la liste de colisage, la référence du transport du connaissement, le montant de la facture.",ok:"Chaque case vient d'un document : l'importateur de la fiche société, les poids de la liste de colisage, le transport du connaissement, le montant et l'Incoterm de la facture, le code d'ADIL.",no:"Les cases en rouge ne correspondent pas aux documents. Ouvrez-les depuis le bureau."},
 {say:"Dites-moi où votre transitaire a trouvé ceci.",q:"Case 6 de la DUM, poids brut : quel document en est la source ?",opts:["Liste de colisage","Facture pro forma","EUR.1","Avis de domiciliation bancaire"],hint:"Quel document décrit les cartons et les kilos ?",ok:"Poids brut : liste de colisage, 1 050 kg. Il doit concorder avec le connaissement et le manifeste.",no:"Les poids sont détaillés sur la liste de colisage."},
 {say:"Et le régime ?",q:"Les cahiers seront vendus au Maroc. Quel régime douanier déclarons-nous ?",opts:["Mise à la consommation (importation définitive)","Transit","Admission temporaire","Exportation"],hint:"La marchandise reste définitivement au Maroc.",ok:"Importation définitive pour la consommation : tous les droits et taxes deviennent exigibles et la marchandise circule librement après la mainlevée.",no:"Le transit et l'admission temporaire suspendent les droits pour des marchandises qui ne restent pas."}]},
{t:"Valeur et taxes",steps:[
 {say:"Place à la calculatrice. Prenez chaque montant dans le bon document.",q:"Construisez la valeur en douane.",rows:[["Prix facturé (EUR)","Facture commerciale"],["Fret maritime (EUR)","Facture de fret"],["Assurance (EUR)","Certificat d'assurance"],["Valeur à la frontière (EUR)","Somme des trois"],["Valeur en douane (MAD)","× 11 (taux de l'exercice)"]],hint:"7 200 + 800 + 100, puis multipliez par 11.",ok:"8 100 EUR × 11 = 89 100 MAD. En FCA, on ajoute fret et assurance car le Maroc taxe une valeur de type CAF.",no:"Ouvrez les trois documents du bureau et additionnez les montants."},
 {say:"SCÉNARIO A : j'accepte votre EUR.1. Le taux préférentiel s'applique.",q:"Calculez la note avec la préférence acceptée.",rows:[["DI à 0 % (taux de l'exercice sous préférence)","0 % × 89 100"],["TPI à 0,25 %","0,25 % × 89 100"],["TVA (exonérée : fournitures scolaires, usage scolaire)","Exonérée"],["Total à payer","DI + TPI + TVA"]],hint:"0,25 % de 89 100 = 89 100 × 0,0025.",ok:"La TPI s'applique aussi aux importations préférentielles : 222,75 MAD. C'est toute la note dans le scénario A.",no:"La TPI correspond à 0,25 % de la valeur en douane."},
 {say:"SCÉNARIO B : imaginez que l'EUR.1 manque ou soit refusé. Le taux général s'applique. Nous utilisons un taux D'ENTRAÎNEMENT de 40 % : il n'est pas vérifié, lisez le vrai sur ADIL.",q:"Calculez la note sans la préférence.",rows:[["DI à 40 % (taux d'entraînement)","40 % × 89 100"],["TPI à 0,25 %","0,25 % × 89 100"],["Total à payer","DI + TPI"]],hint:"40 % de 89 100 = 35 640.",ok:"Sans preuve d'origine, la note passe de 222,75 MAD à 35 862,75 MAD dans cet exercice. Un seul document peut changer tout le coût.",no:"DI = 89 100 × 0,40."},
 {say:"Une question sur l'assiette de la taxe.",q:"Quand la TVA s'applique à l'import, quelle est sa base ?",opts:["Valeur en douane + droit d'importation + autres droits et taxes comme la TPI","Le prix facturé uniquement","Le fret uniquement","La marge de l'importateur"],hint:"Les taxes s'empilent.",ok:"La TVA à l'import se calcule sur la valeur en douane augmentée des droits et taxes. Si notre exonération était refusée, 20 % s'appliqueraient sur cette base.",no:"La base de la TVA inclut les droits."}]},
{t:"Contrôle douanier",steps:[
 {say:"Je travaille pour le contrôle de conformité des produits industriels. Les cahiers scolaires sont sur notre liste des produits contrôlés à l'arrivée.",q:"Quelle autorité vérifie la conformité des cahiers scolaires à la norme marocaine ?",opts:["Le Ministère de l'Industrie et du Commerce (contrôle des produits industriels)","L'ONSSA","L'Office des Changes","L'agent maritime"],hint:"L'ONSSA s'occupe des aliments, des végétaux et des animaux.",ok:"Les cahiers doivent respecter NM 04.4.002 ou NM 04.4.003. La demande passe par PortNet et le résultat (autorisation d'accès au marché) revient à la douane.",no:"L'ONSSA contrôle les produits alimentaires et agricoles, pas la papeterie."},
 {say:"BADR a sélectionné votre déclaration pour un contrôle. Je voudrais une preuve de la composition et du grammage du papier.",q:"CHOISISSEZ LE BON DOCUMENT pour répondre à l'inspecteur.",opts:["La fiche technique du produit et le rapport d'essai","Le connaissement","L'avis de domiciliation bancaire","L'avis d'arrivée"],hint:"Quels documents parlent de g/m² et de pâte à papier ?",ok:"On répond aux questions techniques avec des documents techniques. L'inspecteur peut aussi ouvrir des cartons pour comparer la marchandise à la déclaration.",no:"Les documents de transport et de banque ne disent rien du papier."},
 {say:"Voici comment se déroule mon contrôle.",q:"Remettez les étapes du contrôle de conformité dans l'ordre.",items:["Contrôle documentaire du dossier","Contrôle physique de la marchandise","Prélèvement d'échantillons","Autorisation d'accès au marché"],hint:"D'abord les papiers, puis la marchandise, puis le laboratoire.",ok:"Documents, marchandise, échantillons, décision. Si le dossier est refusé, la marchandise doit être réexportée ou détruite aux frais de l'importateur.",no:"Commencez par les documents."},
 {say:"Un mot sur nos circuits.",q:"Que signifie le circuit vert dans BADR ?",opts:["Mainlevée immédiate sans autre contrôle douanier","Un contrôle physique de chaque carton","La marchandise est saisie","La DUM est annulée"],hint:"Vert, ça veut dire : on avance.",ok:"Vert : mainlevée immédiate. Orange et rouge signifient des contrôles plus poussés. Les contrôles des autres autorités, comme la conformité, sont distincts.",no:"Le vert est le circuit le plus léger."}]},
{t:"Obtenir la mainlevée",steps:[
 {say:"On y est presque. Avant d'accorder la mainlevée, je vérifie ma liste.",q:"Sélectionnez tout ce qui doit être fait avant que la douane libère la marchandise (4 éléments).",opts:[["DUM enregistrée et acceptée"],["Droits et taxes payés ou garantis"],["Contrôle douanier clôturé"],["Autorisation d'accès au marché reçue"],["Fournisseur déjà payé en totalité"],["Certificat sanitaire ONSSA"],["Cahiers déjà vendus aux écoles"]],hint:"Le paiement du fournisseur intervient après l'imputation douanière, pas avant.",ok:"Déclaration, contrôles, conformité et paiement (ou garantie) : la mainlevée peut alors être accordée.",no:"Pensez à ce dont la douane elle-même a besoin."},
 {say:"Vous avez la mainlevée ? Bien, mais ma barrière n'est pas encore ouverte.",q:"Que faut-il encore avant que le camion puisse quitter le terminal ?",opts:["Le bon à délivrer du transporteur et le règlement des frais du terminal","Une deuxième DUM","Un nouveau titre d'importation","Rien : la mainlevée ouvre la barrière toute seule"],hint:"Mainlevée douanière et livraison physique sont différentes.",ok:"La douane libère la marchandise ; le transporteur et le terminal la livrent. Les deux sont nécessaires.",no:"La mainlevée est une décision douanière. La marchandise est encore entre les mains du transporteur et du terminal."},
 {say:"Dernière ligne droite ! Remettez les dernières étapes dans l'ordre.",q:"De la mainlevée à l'entrepôt.",items:["Mainlevée accordée dans BADR","Bon à délivrer et frais du terminal","Chargement du camion et barrière de sortie","Livraison à l'entrepôt d'Atlas Scolaire","La banque paie le fournisseur sur le titre imputé"],hint:"Le fournisseur est payé à la fin.",ok:"Mainlevée, bon à délivrer, barrière, entrepôt, puis la banque règle le fournisseur sur la base du titre d'importation imputé.",no:"Commencez par la décision de la douane."}]}
]};

{t:"صنّف السلعة",steps:[
