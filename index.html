  lines:[[null,"Papiers non couchés pour l'écriture… — كاغط ديال الكتابة، رولوات ولا أوراق"],[null,"Registres, carnets, agendas… — سجلات، كارنيات، أجندات وبحالهم"],[null,"Cahiers — الكنانش (الدفاتر)"],[null,"Classeurs, chemises… — كلاسورات وملفات"],[null,"Autres articles du 48.20 — حوايج أخرى من البند 48.20"],[null,"Livres et imprimés — كتب ومطبوعات"]],
  hint:"السلعة ديالنا كناش ديال التلميذ بالسطور. بالفرنسية: cahier.",ok:"<bdi>4820.20.00.00</bdi> فيه الكنانش (cahiers). هو البند اللي مذكور فالنصوص الرسمية المغربية على الكنانش.",no:"شوف[[|ي]] مزيان شنو <b>هي</b> السلعة: كناش بالسطور للتلاميذ. ماشي كاغط بوحدو، ماشي أجندة، ماشي كتاب مطبوع."},
 {say:"مزيان. دابا قول[[|ي]] ليا شنو اللي كيحدد التصنيف بصح.",q:"شنو هي المعلومة اللي كتحدد التصنيف الجمركي؟",opts:["شنو هي السلعة، من آش مصنوعة وفاش كتستعمل","الثمن ديالها والـ Incoterm","الماركة واللون ديال الغلاف","البلاد ديال المورد"],hint:"شوف[[|ي]] بطاقة السلعة: ثلاثة ديال الأسئلة.",ok:"التصنيف كيعتمد على الطبيعة، المادة والاستعمال ديال السلعة. الثمن والمنشأ كيهمّو من بعد، فالقيمة وفالامتيازات.",no:"الثمن والماركة وبلاد المورد مكيبدلوش شنو هي السلعة."},
 {say:"آخر تأكيد قبل ما نكمّلو.",q:"شنو كيعطينا ADIL على بند تعريفي؟",opts:["الرسوم والضرائب والمراقبات اللي كتطبق، كمعلومة","Mainlevée ديال السلعة","سند الاستيراد","قرار ملزم والديوانة عمرها ماتقدر تناقشو"],hint:"ADIL أداة باش تقلّب.",ok:"ADIL كيعطي المعلومة: DI، TPI، TVA، النسب التفضيلية والمراقبات. مكيودع والو ومكيرخّص لوالو.",no:"ADIL أداة ديال المعلومات. التصريح كيتدار من بعد فـ BADR."}]},
{t:"عرّف بالمستورد",steps:[
 {say:"جوج شركات كاينين فالملف ديالنا. الديوانة خاصها تعرف شكون كيدير شنو.",q:"صيفط[[|ي]] كل عنصر للطرف الصحيح.",buckets:["المستورد (Atlas Scolaire)","الترانزيتير (Transit Al Marsa)"],items:[["السجل التجاري و ICE ديال المشتري"],["Agrément (رقم الاعتماد عند الديوانة)"],["عندو سند الاستيراد وهو اللي غادي يخلص الرسوم"],["كيودع وكيوقّع الـ DUM فـ BADR"],["كيعطي التوكيل"],["كياخد التوكيل"]],hint:"المستورد مول السلعة وهو اللي كيخلص. الترانزيتير كيصرّح فبلاصتو.",ok:"المستورد معروف بالـ RC والـ ICE ديالو وكيبقى مسؤول على الاستيراد. الترانزيتير المعتمد كيصرّح فبلاصتو بتوكيل.",no:"شوف[[|ي]] التوكيل: شكون كيعطي الحق لشكون؟"},
 {say:"صباح الخير. شكون اللي عندو الحق يستورد للتجارة؟",q:"شنو خاص الشركة يكون عندها قبل ما تستورد سلعة باش تعاود تبيعها؟",opts:["التسجيل فالسجل التجاري (و ICE)","غير البطاقة الوطنية","ضمانة جمركية ميريكانية","والو: أي واحد يقدر يستورد أي كمية باش يبيع"],hint:"شوف[[|ي]] بطاقة التعريف ديال الشركة.",ok:"المستورد التجاري خاصو يكون مسجل فالسجل التجاري وعندو ICE. هاد المعرفات كتدخل فـ PortNet وفالـ DUM.",no:"الاستيراد التجاري كتديرو شركات مسجلة."}]},
{t:"دير سند الاستيراد",steps:[
 {say:"مرحبا بيك[[|ي]] فالبنكة. قبل ما نخلص Porto Paperworks، خاصك سند الاستيراد.",q:"الكنانش المدرسية حرة فالاستيراد. شنو هو السند اللي كندرو فـ PortNet؟",opts:[null,null,null,"ماخاص حتى سند للاستيراد التجاري"],hint:"الرخصة (licence) للسلع اللي فيها قيود.",ok:"السلع الحرة فالاستيراد، السند ديالها هو الـ Engagement d'importation. كيتدار فـ PortNet وكيتوطّن فالبنكة.",no:"الرخصة للسلع اللي فيها قيود، والـ déclaration préalable لحالات محددة. الكنانش ماخاصهاش حتى وحدة فيهم."},
 {skin:"PORTNET · سند الاستيراد (محاكاة)",say:"عمّر[[|ي]] الاستمارة من الفاتورة الأولية. كل خانة خاصها تكون متطابقة مع الوثائق.",q:"كمّل[[|ي]] سند الاستيراد.",fields:[["المستورد (Importateur)"],["المورد الأجنبي (Fournisseur)"],["الرمز الجمركي"],["القيمة والعملة"],["شرط التسليم (Incoterm)"],["نوع السند"]],okB:"سند الاستيراد واجد للتوطين",noB:"الاستمارة ناقصة ولا فيها تناقض",hint:"السند كيعاود الثمن ديال السلعة اللي فالـ Pro forma: <bdi>7,200 EUR FCA</bdi>.",ok:"السند كيعاود المعطيات التجارية: المستورد، المورد، السلعة، القيمة والـ Incoterm. البنكة غادي تقارنو مع الـ Pro forma.",no:"قارن[[|ي]] كل خانة مع الفاتورة الأولية وبطاقة الشركة."},
 {say:"حاجة أخيرة على الدور ديالي.",q:"شنو كدير البنكة ملي كتوطّن سند الاستيراد؟",opts:["كتأكد بلي العقد متطابق مع السند وبلي شروط الخلاص كتحترم قواعد الصرف","كتصنّف السلعة","كتعطي الـ Mainlevée","كتفتش الكراطن"],hint:"البنكة كتتلاها بالخلاص، ماشي بالسلعة.",ok:"البنكة كتراجع العقد التجاري مع السند وشروط الخلاص. والخلاص عادة كيجي من بعد ما الديوانة كتقيّد السند.",no:"التصنيف والـ Mainlevée خدمة الديوانة."}]},
{t:"الوثائق والمنشأ",steps:[
 {say:"Olá! الكراطن واجدين فبورتو. شنو هوما الوراق اللي بغيتي منّا للملف ديال الديوانة؟",q:"ختار[[|ي]] كاع الوثائق اللي بلاصتها فملف الاستيراد ديال هاد الشحنة (6 وثائق).",opts:[["الفاتورة التجارية"],["لائحة الطرود (Packing list)"],["وثيقة الشحن البحري (B/L)"],["إثبات المنشأ EUR.1"],["فاتورة الشحن"],["شهادة التأمين"],["الشهادة الصحية ديال ONSSA"],["وثيقة النقل الجوي"],["البروشور الإشهاري ديال المورد"]],hint:"نقل بحري، سلع ديال الكاغط، FCA، امتياز أوروبي.",ok:"الفاتورة، لائحة الطرود والـ B/L هوما الأساس. فاتورة الشحن والتأمين كيكمّلو القيمة فالديوانة فـ FCA. والـ EUR.1 كيدعم الامتياز.",no:"فكّر[[|ي]] فالحالة ديالنا: نقل بحري (ماشي طيارة)، كنانش (ماشي شهادة صحية)."},
 {say:"الناس كيخلطو ثلاثة ديال الكلمات على البلدان. خليني نجرّبك.",q:"ربط[[|ي]] كل جملة بالمفهوم الصحيح.",buckets:["بلاد الإرسال","بلاد المنشأ","المنشأ التفضيلي"],items:[["الكراطن طلعو للبابور فـ Leixões، البرتغال"],["الكنانش تصنعو فمعمل فبورتو"],["EUR.1 مقبولة كتبيّن بلي السلعة كتحترم الاتفاقية بين الاتحاد الأوروبي والمغرب"],["إلا كان البابور خرج من صبانيا، هادي غادي تتبدل ولكن المعمل لا"]],hint:"الإرسال = منين تصيفطات. المنشأ = فين تصنعات. التفضيلي = مثبت فإطار اتفاقية.",ok:"الإرسال كيتعلق بالنقل، المنشأ بالتصنيع، والمنشأ التفضيلي باحترام القواعد ديال اتفاقية وإثباتها.",no:"البلاصة اللي تصيفطات منها السلعة ماشي ديما هي فين تصنعات."},
 {say:"الفاتورة ديالنا <bdi>7,200 EUR</bdi>. أنا ماشي مصدّر معتمد.",q:"شنو هو إثبات المنشأ التفضيلي اللي مناسب لهاد الشحنة؟",opts:["شهادة التنقل EUR.1 مختومة من ديوانة بلاد التصدير","جملة بسيطة مكتوبة فالفاتورة من عند أي مصدّر","وثيقة الشحن B/L","حتى إثبات: البرتغال فالاتحاد الأوروبي، هادشي كافي"],hint:"التصريح بالمنشأ من عند أي مصدّر محدود فـ <bdi>6,000 EUR</bdi>.",ok:"فوق <bdi>6,000 EUR</bdi>، التصريح بالمنشأ غير للمصدّرين المعتمدين، إذن روي كيطلب EUR.1 من الديوانة ديالو.",no:"الامتياز خاصو يتثبت بإثبات منشأ مقبول."},
 {say:"تسنّا[[|ي]]. وصلاتني نسخة أولى ديال لائحة الطرود. قارنها[[|ي]] مع الفاتورة.",q:"لقى[[|ي]] الغلطة: شنو خاصو يتراجع قبل ما تتودع الـ DUM؟",opts:["الكمية: الفاتورة فيها <bdi>2,400</bdi> ولائحة الطرود فيها <bdi>2,600</bdi>","السمية ديال البائع","الوزن الإجمالي","والو، الوثائق متطابقين"],hint:"لوّن[[|ي]] الكمية فالجوج ديال الوثائق.",ok:"الوثائق اللي ماكيتفاهموش كيعطّلو الديدوانما: الديوانة تقدر تطلب التوضيح ولا تفتش السلعة. المورد صحح اللائحة لـ <bdi>2,400</bdi>.",no:"حل[[|ي]] الجوج ديال الوثائق وقارن[[|ي]] الكمية."},
 {say:"والـ Incoterm؟",q:"فـ FCA Leixões، شكون اللي كيخلص الشحن البحري حتى لكازا؟",opts:["المشتري، إذن خاص نزيدو الشحن باش نوصلو للقيمة فالديوانة","البائع، إذن ديجا داخل فثمن الفاتورة","الترانزيتير","حتى واحد: الشحن فابور فـ FCA"],hint:"FCA: الخدمة ديال البائع كتسالي ملي كيسلّم السلعة للناقل.",ok:"فـ FCA المشتري كيخلص النقل الرئيسي والتأمين. ماكاينينش فالفاتورة، إذن كنزيدوهم للقيمة فالديوانة.",no:"قرا[[|ي]] الفاتورة: الشحن والتأمين ماداخلينش."}]},
{t:"وصول الشحنة",steps:[
 {say:"البابور Zellige Wave حدا الرصيف! شوف[[|ي]] الشاشة ديالي: ربعة ديال الوثائق، وجوج أنواع ديال الناس موراهم.",q:"شكون المسؤول على كل وثيقة؟",buckets:["الناقل / الوكيل البحري","المستورد / الترانزيتير"],items:[["المانيفست"],["التصريح الموجز (DS)"],["وثيقة الشحن (شكون كيعطيها)"],["DUM"]],hint:"غير وحدة فيهم هي التصريح الجمركي ديال المستورد.",ok:"المانيفست والـ DS والـ B/L جايين من جهة الناقل. الـ DUM هي التصريح المفصل ديال المستورد، كيودعها الترانزيتير.",no:"الناقل كيصرّح بالبابور كامل. المستورد كيصرّح غير بالسلعة ديالو."},
 {say:"لقى[[|ي]] المعلومة. الديوانة كتسولني على السلعة ديالك.",q:"حل[[|ي]] المانيفست: شحال من طرد وشحال الوزن الإجمالي المسجلين فالـ B/L ديالنا؟",hint:"الوزن الإجمالي فيه حتى التلفيف.",ok:"<bdi>120</bdi> كرطونة و <bdi>1,050 kg</bdi> إجمالي: نفس الشي فالـ B/L، المانيفست، الـ DS وقريب فالـ DUM.",no:"شوف[[|ي]] السطر ديال المانيفست ديال الـ B/L <bdi>ABL-LEI-CAS-0042</bdi>."},
 {say:"الـ DS تسجلات. شي مستوردين كيحسابليهم سالات.",q:"شنو كدير التصريح الموجز (Déclaration sommaire)؟",opts:["كتحط السلعة تحت مراقبة الديوانة حتى تتودع الـ DUM","كتدوّز السلعة باش تتباع فالمغرب","كتحسب الرسوم والضرائب","كتعوّض سند الاستيراد"],hint:"موجز، ماشي مفصل.",ok:"الـ DS كتعرّف السلعة وكتحطها تحت مراقبة الديوانة. التصنيف والقيمة والضرائب كيجيو مع الـ DUM، اللي كتذكر الـ DS كوثيقة سابقة.",no:"الـ DS مكتصنّف ومكتقيّم والو."}]},
{t:"عمّر الـ DUM",steps:[
 {skin:"BADR · التصريح المفصل (محاكاة)",say:"الترانزيتير ديالك قدام الشاشة ديال BADR. عمّر[[|ي]] الخانات الناقصين من الوثائق اللي فالملف ديالك. كتب[[|ي]] الوزن اللي غادي تلقى فلائحة الطرود.",q:"كمّل[[|ي]] الـ DUM.",fields:[null,null,null,null,[null,["Maroc","Portugal","Espagne"]]],okB:"المعطيات ديال الـ DUM مقبولة",noB:"التصريح خاصو يتصحح",hint:"الوزن من لائحة الطرود، مرجع النقل من الـ B/L، والمبلغ من الفاتورة.",ok:"كل خانة جاية من وثيقة: المستورد من بطاقة الشركة، الوزن من لائحة الطرود، النقل من الـ B/L، المبلغ والـ Incoterm من الفاتورة، والرمز من ADIL.",no:"الخانات اللي بالحمر ماكيتطابقوش مع الوثائق. حلهم من المكتب."},
 {say:"قول[[|ي]] ليا منين جاب الترانزيتير ديالك هادي.",q:"الخانة 6 فالـ DUM، الوزن الإجمالي: شنو هي الوثيقة المصدر؟",opts:["لائحة الطرود (Packing list)","الفاتورة الأولية","EUR.1","إشعار التوطين البنكي"],hint:"شنو هي الوثيقة اللي كتوصف الكراطن والكيلوات؟",ok:"الوزن الإجمالي: لائحة الطرود، <bdi>1,050 kg</bdi>. خاصو يكون متطابق مع الـ B/L والمانيفست.",no:"الوزن مفصل فلائحة الطرود."},
 {say:"والنظام؟",q:"الكنانش غادي يتباعو فالمغرب. شنو هو النظام الجمركي اللي كنصرّحو بيه؟",opts:["Mise à la consommation (استيراد نهائي)","Transit (العبور)","Admission temporaire (القبول المؤقت)","التصدير"],hint:"السلعة غادي تبقى فالمغرب نهائياً.",ok:"استيراد نهائي للاستهلاك: كاع الرسوم والضرائب كيوليو واجبين والسلعة كتدور بحرية من بعد الـ Mainlevée.",no:"العبور والقبول المؤقت كيوقفو الرسوم للسلع اللي مغاديش تبقى."}]},

 $("#lC").onclick=()=>{$("#ov").classList.remove("open");A=null;flyDocs(aw.length);hud();SC.p.mark(S.lv);SC.p.act("cheer",2200);
  if(n===8)finale();else{if(n===3){SC.p.ship(.5);toast("🚢 "+t("atSea"))}mapMsg()}}}
function flyDocs(k){if(rm())return;const b=$("#folderBtn")||$("#fab");if(!b)return;const r=b.getBoundingClientRect();for(let i=0;i<Math.min(k,6);i++){const f=document.createElement("div");f.className="fly";f.style.left=(innerWidth/2-22+i*14)+"px";f.style.top=(innerHeight/2)+"px";document.body.appendChild(f);setTimeout(()=>{f.style.left=(r.left+r.width/2-10)+"px";f.style.top=r.top+"px";f.style.transform="scale(.3) rotate(25deg)";f.style.opacity=.3},40+i*110);setTimeout(()=>{f.remove();b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");snd("collect")},900+i*110)}}
function finale(){
 const m=$("#mapmsg"),sc=$("#pScene");let done=false;
 const end=()=>{if(done)return;done=true;S.fin=true;save();board();updFab();show("final")};
 H(m,`<b>${t("missionComplete")}</b> <button class="btn sm" id="fSkip" style="margin-inline-start:10px">${t("resultsB")}</button>`);$("#fSkip").onclick=end;
 if(rm()){end();return}
 const card=document.createElement("div");card.className="relcard";H(card,`<b>MAINLEVÉE</b><small>${t("academicSim")}</small><span style="font-size:11px">${CASE.n.ml}</span>`);sc.appendChild(card);
 const stp=document.createElement("div");stp.className="bigstamp";
 setTimeout(()=>{const hb=SC.p.heroRect(),sb=sc.getBoundingClientRect();card.style.left=(hb.left-sb.left+hb.width/2-30)+"px";card.style.top=(hb.top-sb.top-10)+"px";card.style.transform="scale(.35) rotate(-10deg)"},400);
 setTimeout(()=>{card.style.opacity=0;SC.p.act("cheer",3200);snd("stamp");H(stp,`<div class="stamp">MAINLEVÉE GRANTED<small>${t("academicSim")}</small></div>`);sc.appendChild(stp)},1700);
 setTimeout(()=>SC.p.gate(true),2600);
 setTimeout(()=>{SC.p.truck(true);confetti();snd("final")},3300);
 setTimeout(end,S.mode==="class"?6200:7400)}
function board(){try{const b=JSON.parse(LS.get(BKEY)||"[]");b.push({n:S.name,s:S.score,m:S.mode,d:new Date().toLocaleDateString()});b.sort((x,y)=>y.s-x.s);LS.set(BKEY,JSON.stringify(b.slice(0,10)))}catch(e){}}
function renderFinal(){
 if(!S.fin){show("play");return}
 const tot=LV.reduce((a,l)=>a+l.steps.filter(s=>S.mode==="full"||s.core).length,0),max=tot*50,pc=S.score/max;
 const rank=pc>=.9?t("rank1"):pc>=.7?t("rank2"):pc>=.45?t("rank3"):t("rank4");
 let b=[];try{b=JSON.parse(LS.get(BKEY)||"[]")}catch(e){}
 const r=(a,v)=>`<tr><th>${a}</th><td>${v}</td></tr>`;
 H("#v-final",`<div class="card" style="text-align:center;margin-bottom:14px;background:linear-gradient(#fff,#e4f8f6)"><p class="edu">${t("academicSim")}</p><h1 style="font-size:clamp(28px,5vw,52px);color:var(--deep);margin:0">${t("missionComplete")}</h1><div class="stamp">MAINLEVÉE GRANTED<small>${t("academicSim")}</small></div><h2 style="color:var(--tqd)">${t("clearedMA")}</h2><p>${t("finalP",esc(S.name))}</p><div class="homebtns"><button class="btn" id="fnF">📁 ${t("viewMyFile")}</button><button class="btn co" id="fnR">↺ ${t("playAgain")}</button></div></div>
 <div class="grid2"><div class="card"><h2>📊 ${t("results")}</h2><table class="t">${r(t("totalScore"),`<b>${bd(S.score+" / "+max)}</b> · ${rank}`)+r(t("levelsDone"),bd("9 / 9"))+r(t("docsCollected"),bd(S.file.length+" / "+DOC_ORDER.length))+r(t("hintsUsed"),bd(S.hints))+r(t("solRevealed"),bd(S.reveals))+r(t("wrongTries"),bd(S.wrong))+r(t("firstTry"),bd(S.first+" / "+tot))+r(t("finalStatus"),`✅ ${TRACK.st[9]} <small class="sm">(${t("academicSim")})</small>`)+r(t("mode"),S.mode==="class"?t("modeClass"):t("modeFull"))}</table></div>
 <div class="card"><h3>🏆 ${t("ranking")}</h3><table class="t"><tr><th>#</th><th>${t("name")}</th><th>${t("pts")}</th><th>${t("mode")}</th></tr>${b.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${bd(x.s)}</td><td>${x.m==="class"?t("modeClass"):t("modeFull")}</td></tr>`).join("")}</table></div>
 <div class="card"><h3>${t("learned")}</h3>${flowHTML()}<p>${t("learnedP")}</p></div></div>`);
 $("#fnF").onclick=openFolder;$("#fnR").onclick=restart}
function confetti(){const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const col=["#17b3a8","#ff9f1c","#ffd166","#ef5d60","#6cc070","#2a86c8"],P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,w:6+Math.random()*8,r:Math.random()*6,c:col[Math.floor(Math.random()*6)],s:Math.random()*.2-.1}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30)*1.5;p.r+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});if(++n<260)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#viewer").classList.contains("open")){VW=[];drawDoc()}else if($("#fov").classList.contains("open"))$("#fov").classList.remove("open");else if($("#gov").classList.contains("open"))$("#gov").classList.remove("open");else if($("#sov").classList.contains("open"))$("#sov").classList.remove("open")}
 if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("thumb")){e.preventDefault();e.target.click()}});
